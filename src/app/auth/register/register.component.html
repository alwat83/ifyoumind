<main class="auth-shell">
  <a routerLink="/" class="brand">ifYouMind</a>
  <section class="auth-card">
    <p class="eyebrow">Start free</p>
    <h1>Make your next market decision with more evidence.</h1>
    <form (ngSubmit)="register()" #registerForm="ngForm">
      <label><span>Name</span><input name="displayName" type="text" required [(ngModel)]="displayName" /></label>
      <label><span>Email</span><input name="email" type="email" required email [(ngModel)]="email" /></label>
      <label><span>Password</span><input name="password" type="password" required minlength="6" [(ngModel)]="password" /></label>
      <button type="submit" [disabled]="registerForm.invalid">Create free account</button>
    </form>
    <div class="divider"><span>or</span></div>
    <button class="google" type="button" (click)="googleLogin()">Continue with Google</button>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
    <p class="fine">By creating an account, you agree to the Terms and Privacy Policy.</p>
  </section>
</main>
