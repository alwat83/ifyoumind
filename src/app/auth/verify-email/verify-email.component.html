<main class="verify-shell">
  <a routerLink="/" class="brand">ifYouMind</a>
  <section class="card" aria-labelledby="verify-title">
    <p class="eyebrow">One quick step</p>
    <h1 id="verify-title">Check your email to continue.</h1>
    <p class="sub">We sent a link to <strong>{{ email }}</strong>. Open it, then come back here. Your market analysis starts right after.</p>
    <button type="button" class="primary" (click)="continueIfVerified()" [disabled]="isChecking">
      {{ isChecking ? 'Checking…' : "I've verified, continue" }}
    </button>
    <button type="button" class="secondary" (click)="resendVerificationEmail()" [disabled]="isResending">
      {{ isResending ? 'Sending…' : 'Resend the email' }}
    </button>
    <p *ngIf="message" class="message" [class.error]="message.type === 'error'" role="status">{{ message.text }}</p>
    <p class="fine">Not arriving? Check spam or promotions. Wrong address? <button type="button" class="link" (click)="useDifferentEmail()">Use a different email</button></p>
  </section>
</main>
