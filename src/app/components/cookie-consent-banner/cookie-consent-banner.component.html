<div class="cookie-consent-banner" *ngIf="showBanner" role="region" aria-label="Cookie choice">
  <div class="container">
    <p>
      We'd like to use Google Analytics cookies to see how visitors use ifYouMind. Google Analytics only runs if you allow it.
      <a routerLink="/privacy-policy">Privacy Policy</a>
    </p>
    <div class="actions">
      <button type="button" (click)="acceptAll()" class="accept">Allow analytics</button>
      <button type="button" (click)="declineAll()" class="decline">Reject</button>
      <button type="button" (click)="manage()" class="manage">Manage</button>
    </div>
  </div>
</div>
