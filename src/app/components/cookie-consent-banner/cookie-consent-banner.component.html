<section #banner class="cookie-consent-banner" *ngIf="showBanner" aria-label="Optional analytics">
  <div class="container">
    <p>Allow Google Analytics to measure visits and example interactions? Bills, questions and report contents are excluded. <a routerLink="/privacy-policy">Privacy and choices</a></p>
    <div class="actions"><button (click)="acceptAll()">Allow analytics</button><button (click)="declineAll()">Reject analytics</button><button (click)="manage()">Manage</button></div>
  </div>
</section>
