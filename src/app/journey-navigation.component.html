<header class="product-header" (click)="follow($event, menu)">
  <a href="/" class="brand" aria-label="ifYouMind home">ifyoumind</a>
  <nav class="desktop-nav topbar" aria-label="Main navigation">
    <a *ngFor="let link of links" [href]="link.href" [attr.aria-current]="current === link.key ? 'page' : null">{{ link.label }}</a>
    <span class="account-links">
      <ng-container *ngIf="signedIn; else signIn">
        <a href="/decisions" [attr.aria-current]="current === 'saved' ? 'page' : null">Your decisions</a>
        <a href="/account" [attr.aria-current]="current === 'account' ? 'page' : null">Account</a>
      </ng-container>
      <ng-template #signIn><a class="sign-in" href="/login">Sign in</a></ng-template>
    </span>
  </nav>
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- Native summary owns focus; Escape from menu links restores it. -->
  <details #menu class="mobile-navigation" (keydown.escape)="menu.open = false; trigger.focus()">
    <summary #trigger>Menu <span aria-hidden="true">☰</span></summary>
    <nav class="topbar" aria-label="Mobile navigation">
      <a *ngFor="let link of links" [href]="link.href" [attr.aria-current]="current === link.key ? 'page' : null">{{ link.label }}</a>
      <span class="menu-divider" aria-hidden="true"></span>
      <ng-container *ngIf="signedIn; else mobileSignIn">
        <a href="/decisions" [attr.aria-current]="current === 'saved' ? 'page' : null">Your decisions</a>
        <a href="/account" [attr.aria-current]="current === 'account' ? 'page' : null">Account</a>
      </ng-container>
      <ng-template #mobileSignIn><a href="/login">Sign in</a></ng-template>
    </nav>
  </details>
</header>
